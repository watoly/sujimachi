# リリースを作り、単一 HTML の配布版を添付する。
#
# 起動方法は 2 つある。
#
#   1. GitHub の Actions 画面から手動で実行し、バージョン（例: v0.1.0）を入力する
#      → タグの作成からリリースまで全部やる。git コマンドは不要
#   2. タグを push する
#      → git tag v0.1.0 && git push origin v0.1.0
#
# 手元でビルドして手作業で添付する運用だと、ビルドし忘れや古いファイルの
# 添付が起きる。タグの時点のソースから必ずビルドし直すことで、
# 配布物とソースが必ず一致することを保証する。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（例: v0.1.0）'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# リリースとタグを作るために必要
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: バージョンを決める
        id: ver
        env:
          # 入力値をシェルへ直接展開せず環境変数経由で渡す（コマンド注入の回避）
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "バージョンは v で始めてください（例: v0.1.0）。入力: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "リリースするバージョン: $TAG"

      - name: 依存関係をインストール
        run: npm ci

      # build:standalone は tsc による型検査を含むので、
      # 型エラーがあればここでリリースが止まる
      - name: 配布版をビルド
        run: npm run build:standalone

      - name: 成果物を検査
        run: |
          set -eu
          test -f dist-standalone/sujimachi.html
          echo "サイズ: $(du -h dist-standalone/sujimachi.html | cut -f1)"
          # 外部参照が残っていないこと（1 ファイルだけで完結する保証）
          if grep -qE '(src|href)="[^"]*"' dist-standalone/sujimachi.html; then
            echo "外部参照が残っています" >&2
            exit 1
          fi

      # gh release create はタグが無ければ作成してくれるので、
      # 手動実行の場合もここでタグが作られる
      - name: リリースを作成
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          cat > notes.md <<EOF
          ## ダウンロード

          下の \`sujimachi.html\` をダウンロードし、ブラウザで開くだけで使えます。

          - インストール・サーバー・インターネット接続はいずれも不要です
          - 推奨ブラウザ: Chrome / Edge
          - 読み込んだ CSV は端末内でのみ処理され、外部には送信されません

          使い方は [README](https://github.com/${REPO}#readme) を参照してください。
          EOF
          gh release create "$TAG" \
            dist-standalone/sujimachi.html \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
